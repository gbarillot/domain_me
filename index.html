<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Les sites de Guillaume et Sandrine Barillot."
    />
    <link rel="icon" href="data:," />
    <title>Barillot</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #132a2c;
        --muted: #526567;
        --paper: #f3efe5;
        --accent: #c65d3b;
        --line: rgba(19, 42, 44, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 80% 15%, rgba(198, 93, 59, 0.13), transparent 30rem),
          var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 3rem, 68rem);
        margin: 0 auto;
        padding: clamp(3rem, 10vw, 8rem) 0;
      }

      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: clamp(4rem, 10vw, 8rem);
      }

      header::after {
        width: 100%;
        height: 1px;
        background: var(--line);
        content: "";
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 5vw, 3.75rem);
        font-weight: 400;
        letter-spacing: -0.04em;
      }

      .profiles {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(3rem, 8vw, 7rem);
      }

      article {
        display: flex;
        min-height: 13rem;
        flex-direction: column;
        align-items: flex-start;
      }

      h2 {
        margin: 0 0 0.75rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.75rem, 4vw, 2.75rem);
        font-weight: 400;
        line-height: 1.05;
      }

      p {
        max-width: 28rem;
        margin: 0 0 2rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        gap: 0.6rem;
        margin-top: auto;
        color: var(--ink);
        font-weight: 650;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 2px;
        text-underline-offset: 0.35rem;
        transition: color 160ms ease, transform 160ms ease;
      }

      a::before {
        color: var(--accent);
        content: "→";
      }

      a:hover,
      a:focus-visible {
        color: var(--accent);
        transform: translateX(0.25rem);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 0.4rem;
      }

      @media (max-width: 42rem) {
        main {
          width: min(100% - 2rem, 68rem);
        }

        .profiles {
          grid-template-columns: 1fr;
        }

        article {
          min-height: auto;
          padding-bottom: 2.5rem;
          border-bottom: 1px solid var(--line);
        }

        a {
          margin-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="profiles" aria-label="Sites personnels">
        <article>
          <h2>Guillaume Barillot</h2>
          <p>Ingénieur informatique — IA &amp; automatisation pour PME</p>
          <a href="https://guillaume.barillot.me">guillaume.barillot.me</a>
        </article>

        <article>
          <h2>Sandrine Barillot</h2>
          <p>Éducatrice spécialisée</p>
          <a href="https://sandrine.barillot.me">sandrine.barillot.me</a>
        </article>
      </section>
    </main>
  </body>
</html>
